# Bookly — every value comes from the single root .env
# (compose uses it for ${VAR} interpolation and as each service's env_file).

x-node-service: &node-service
  env_file: .env
  restart: unless-stopped
  networks: [bookly]

services:
  # ------------------------------------------------------------------ infra
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    networks: [bookly]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    networks: [bookly]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --------------------------------------------------------------- services
  auth-service:
    <<: *node-service
    build: ./services/auth-service
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${AUTH_SERVICE_PORT}/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  event-service:
    <<: *node-service
    build: ./services/event-service
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${EVENT_SERVICE_PORT}/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  seat-service:
    <<: *node-service
    build:
      context: ./services/seat-service
      additional_contexts:
        proto: ./proto
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 5s
      timeout: 5s
      retries: 20

  booking-service:
    <<: *node-service
    build:
      context: ./services/booking-service
      additional_contexts:
        proto: ./proto
    # Horizontally scaled: nginx round-robins across every replica.
    deploy:
      replicas: ${BOOKING_REPLICAS}
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      seat-service: { condition: service_healthy }
      event-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${BOOKING_SERVICE_PORT}/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  notification-service:
    <<: *node-service
    build: ./services/notification-service
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${NOTIFICATION_SERVICE_PORT}/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------- gateway
  api-gateway:
    build: ./api-gateway
    env_file: .env
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT}:80"
      # Dev-only gRPC proxy to seat-service (grpcurl / race test). Loopback only, never public.
      - "127.0.0.1:${GRPC_GATEWAY_PORT}:9090"
    networks: [bookly]
    depends_on:
      auth-service: { condition: service_healthy }
      event-service: { condition: service_healthy }
      seat-service: { condition: service_healthy }
      booking-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }

networks:
  bookly:

volumes:
  mongo-data:
  redis-data:
