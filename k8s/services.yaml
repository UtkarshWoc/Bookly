apiVersion: apps/v1
kind: Deployment
metadata:
  name: seat-service
  namespace: bookly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seat-service
  template:
    metadata:
      labels:
        app: seat-service
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: seat-service
          image: bookly-seat-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
              name: grpc
          envFrom:
            - configMapRef:
                name: bookly-config
            - secretRef:
                name: bookly-secrets
          readinessProbe:
            exec:
              command: ["node", "src/healthcheck.js"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["node", "src/healthcheck.js"]
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: seat-service
  namespace: bookly
spec:
  selector:
    app: seat-service
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
---
