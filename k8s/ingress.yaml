apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookly-ingress
  namespace: bookly
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - bookly.example.com
      secretName: bookly-tls
  rules:
    - host: bookly.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
