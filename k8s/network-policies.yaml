# Zero-trust intra-namespace network isolation:
# - Only api-gateway accepts external traffic.
# - Downstream services accept requests only from api-gateway (and booking-service -> event-service/seat-service).
# - MongoDB and Redis accept connections only from backend microservices.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: bookly
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-ingress
  namespace: bookly
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-auth-from-gateway
  namespace: bookly
spec:
  podSelector:
    matchLabels:
      app: auth-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - port: 8001
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-event-from-gateway-and-booking
  namespace: bookly
spec:
  podSelector:
    matchLabels:
      app: event-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
        - podSelector:
            matchLabels:
              app: booking-service
      ports:
        - port: 8002
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-seat-from-booking-only
  namespace: bookly
spec:
  podSelector:
    matchLabels:
      app: seat-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: booking-service
      ports:
        - port: 50051
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-booking-from-gateway
  namespace: bookly
spec:
  podSelector:
    matchLabels:
      app: booking-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - port: 8003
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-notification-from-gateway
  namespace: bookly
spec:
  podSelector:
    matchLabels:
      app: notification-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - port: 8004
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-from-gateway
  namespace: bookly
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - port: 3000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mongo-from-services
  namespace: bookly
spec:
  podSelector:
    matchLabels:
      app: mongo
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: auth-service
        - podSelector:
            matchLabels:
              app: event-service
        - podSelector:
            matchLabels:
              app: seat-service
        - podSelector:
            matchLabels:
              app: booking-service
        - podSelector:
            matchLabels:
              app: notification-service
      ports:
        - port: 27017
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-from-services
  namespace: bookly
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: auth-service
        - podSelector:
            matchLabels:
              app: event-service
        - podSelector:
            matchLabels:
              app: seat-service
        - podSelector:
            matchLabels:
              app: booking-service
        - podSelector:
            matchLabels:
              app: notification-service
      ports:
        - port: 6379
          protocol: TCP
