# Development/template Secret. Replace all values via your secrets manager
# (e.g., External Secrets Operator, Sealed Secrets, or kubectl create secret)
# before deploying to any shared or production cluster.
apiVersion: v1
kind: Secret
metadata:
  name: bookly-secrets
  namespace: bookly
type: Opaque
stringData:
  MONGO_URI: "mongodb://mongo:27017"
  JWT_SECRET: "replace-me-with-a-long-random-64-char-secret-before-deploying"
  ADMIN_EMAIL: "admin@bookly.dev"
  ADMIN_PASSWORD: "Replace-With-Strong-Admin-Password!"
