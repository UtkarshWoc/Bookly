# Auth offloading: nginx asks auth-service whether the bearer token is valid
# before the request reaches the upstream. On success, identity is forwarded
# as X-User-Id / X-User-Role so downstream services never parse JWTs.

auth_request /_auth_verify;
auth_request_set $bookly_user_id $upstream_http_x_user_id;
auth_request_set $bookly_user_role $upstream_http_x_user_role;
