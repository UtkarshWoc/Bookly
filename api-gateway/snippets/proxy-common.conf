# Shared proxy settings, included by every proxied location.
# (nginx does not inherit proxy_set_header into a location that sets its own,
#  so every location includes this file instead of relying on inheritance.)

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id $request_id;

# Identity headers are ONLY ever populated by auth_request (see auth-required.conf).
# On public routes these variables are empty, which strips any spoofed value
# a client might send.
proxy_set_header X-User-Id $bookly_user_id;
proxy_set_header X-User-Role $bookly_user_role;

proxy_connect_timeout 3s;
proxy_send_timeout 15s;
proxy_read_timeout 15s;

add_header X-Request-Id $request_id always;
